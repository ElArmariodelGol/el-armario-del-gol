name: Actualizar Catalogo Yupoo

on:
  schedule:
    - cron: '0 4 * * *' # Se ejecuta todos los días a las 4 AM
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

# Permisos necesarios para que el robot pueda subir los archivos al repositorio
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías necesarias
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Ejecutar el Scraper (Descarga fotos y crea JSON)
        run: python scraper.py

      - name: Guardar cambios (JSON y Fotos) en GitHub
        run: |
          git config --global user.name "Bot El Armario"
          git config --global user.email "bot@noreply.github.com"
          # Añadimos tanto el JSON como la carpeta de imágenes
          git add productos.json imagenes/
          # Si hay cambios, hace el commit y sube. Si no hay cambios, no da error.
          git commit -m "🤖 Actualización automática de catálogo y fotos" || exit 0
          git push
