<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Armario del Gol</title>
    <link rel="icon" type="image/jpeg" href="imagenes/logo.jpg">
    <style>
        :root { --bg-dark: #0b0f19; --bg-card: #131c2e; --accent: #10b981; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--bg-dark); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 0.8rem; color: var(--text-main); text-decoration: none; }
        .brand img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); }
        .brand span { font-size: 1.2rem; font-weight: 800; }
        .brand span span { color: var(--accent); }
        
        .main-container { display: flex; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; }
        
        /* MENÚ LATERAL */
        .sidebar { width: 280px; border-right: 1px solid var(--border); padding: 1.5rem 0; flex-shrink: 0; background: var(--bg-dark); overflow-y: auto; max-height: calc(100vh - 70px); }
        .sidebar-header { padding: 0 1.5rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--accent); font-weight: 600; font-size: 1.1rem;}
        .sidebar ul { list-style: none; }
        .sidebar li { padding: 0.9rem 1.5rem; border-bottom: 1px solid #1e293b; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
        .sidebar li:hover { background: var(--bg-card); color: white; }
        
        /* ZONA DERECHA */
        .content { flex: 1; padding: 2rem; }
        .content-header { margin-bottom: 1.5rem; }
        .content-header h1 { font-size: 1.2rem; font-weight: 500; margin-bottom: 0.3rem; }
        .content-header p { font-size: 0.85rem; color: var(--text-muted); }
        
        /* CUADRÍCULA */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        @media(max-width: 1200px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media(max-width: 900px) { .main-container { flex-direction: column; } .sidebar { width: 100%; max-height: none; } .grid { grid-template-columns: repeat(2, 1fr); } }
        
        .card { background: transparent; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        .card-img-container { width: 100%; aspect-ratio: 1/1; background: #070a10; border-radius: 4px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 0.85rem; font-weight: 500; margin-top: 0.5rem; line-height: 1.3; text-align: center; color: var(--text-main); }
        
        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="imagenes/logo.jpg" alt="Logo">
            <div>EL ARMARIO DEL <span>GOL</span></div>
        </a>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header"><span>All categories</span><span>≡</span></div>
            <ul id="sidebarMenu"></ul>
        </aside>

        <main class="content">
            <div class="content-header">
                <h1>All categories</h1>
                <p id="totalAlbums">in total 0 albums</p>
            </div>
            <div class="grid" id="catalogGrid">
                <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Cargando catálogo...</p>
            </div>
        </main>
    </div>

    <footer>
        <p>© 2026 El Armario del Gol • Catálogo Exclusivo</p>
    </footer>

    <script>
        fetch('productos.json')
            .then(r => r.json())
            .then(data => {
                const menu = document.getElementById("sidebarMenu");
                const grid = document.getElementById("catalogGrid");
                
                // 1. Rellenar menú lateral con las categorías reales
                if (data.menu && data.menu.length > 0) {
                    data.menu.forEach(cat => {
                        const li = document.createElement("li");
                        li.innerText = cat.name;
                        menu.appendChild(li);
                    });
                }

                // 2. Rellenar la cuadrícula de productos
                if (data.productos && data.productos.length > 0) {
                    grid.innerHTML = "";
                    document.getElementById("totalAlbums").innerText = `in total ${data.productos.length} albums`;
                    
                    data.productos.forEach(p => {
                        const card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <div class="card-img-container">
                                <img src="${p.img}" class="card-img" referrerpolicy="no-referrer" onerror="this.src='imagenes/logo.jpg'">
                            </div>
                            <div class="card-title">${p.title}</div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    // Si no hay productos (porque Yupoo los carga con JS), mostramos un mensaje
                    grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--accent);'>Las categorías se han cargado a la izquierda. Los productos se mostrarán aquí cuando hagamos la Fase 2.</p>";
                }
            })
            .catch(err => {
                document.getElementById("catalogGrid").innerHTML = "<p style='color:red;'>Error al cargar productos.json.</p>";
            });
    </script>
</body>
</html>
