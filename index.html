<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Armario del Gol</title>
    <link rel="icon" type="image/jpeg" href="imagenes/logo.jpg">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #131c2e;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER ESTILO YUPOO */
        header {
            background-color: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            padding: 1rem 5%;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        @media(min-width: 768px) {
            header { flex-direction: row; justify-content: space-between; }
        }

        .brand { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--text-main); }
        .brand img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .brand span { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand span span { color: var(--accent); }

        /* MENÚ DE CATEGORÍAS COMO YUPOO */
        .nav-menu {
            display: flex; gap: 1.5rem; list-style: none; align-items: center; flex-wrap: wrap; justify-content: center;
        }
        .nav-item {
            position: relative;
        }
        .nav-link {
            background: none; border: none; color: var(--text-main); font-size: 0.95rem; font-weight: 600;
            cursor: pointer; padding: 0.5rem; display: flex; align-items: center; gap: 0.3rem; transition: color 0.2s;
        }
        .nav-link:hover { color: var(--accent); }
        
        .dropdown {
            position: absolute; top: 100%; left: 0; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; padding: 0.5rem; min-width: 200px; display: none; flex-direction: column; gap: 0.2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 101;
        }
        .nav-item:hover .dropdown { display: flex; }
        .dropdown button {
            background: none; border: none; color: var(--text-muted); text-align: left; padding: 0.6rem 1rem;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .dropdown button:hover { background: var(--accent); color: #000; font-weight: 600; }

        /* BUSCADOR */
        .search-bar input {
            padding: 0.6rem 1rem; border-radius: 30px; border: 1px solid var(--border);
            background: var(--bg-card); color: white; font-size: 0.9rem; outline: none; width: 250px;
        }

        /* GRID DE PRODUCTOS (Igual que antes pero adaptado) */
        .catalog {
            padding: 2rem 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1;
        }
        .card {
            background: var(--bg-card); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border); transition: all 0.3s ease;
            display: flex; flex-direction: column; cursor: pointer;
        }
        .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .card-img-container { width: 100%; aspect-ratio: 1/1; background: #070a10; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover .card-img { transform: scale(1.05); }

        .card-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .card-tag { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--text-main); line-height: 1.4; }

        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; margin-top: auto; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 1.5rem; backdrop-filter: blur(8px); }
        .modal.open { display: flex; }
        .modal-content { background: var(--bg-card); border-radius: 20px; max-width: 500px; width: 100%; overflow: hidden; border: 1px solid var(--border); position: relative; animation: scaleUp 0.3s ease; }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.6); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: var(--accent); color: #000; }
        .modal-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .modal-info { padding: 1.5rem; text-align: center; }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="imagenes/logo.jpg" alt="Logo">
            <div>EL ARMARIO DEL <span>GOL</span></div>
        </a>

        <!-- MENÚ YUPOO -->
        <ul class="nav-menu" id="yupooMenu">
            <li class="nav-item">
                <button class="nav-link" onclick="loadProducts('Todos')">Inicio</button>
            </li>
            <!-- Aquí JavaScript inyectará las categorías reales -->
        </ul>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar...">
        </div>
    </header>

    <main class="catalog" id="catalogGrid"></main>

    <footer>
        <p>© 2026 El Armario del Gol • Catálogo Exclusivo</p>
    </footer>

    <!-- Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" type="button" onclick="closeModal()">×</button>
            <img id="mImg" class="modal-img" src="" alt="" referrerpolicy="no-referrer">
            <div class="modal-info">
                <span class="card-tag" id="mCat"></span>
                <h2 class="modal-title" id="mTitle"></h2>
            </div>
        </div>
    </div>

    <script>
        let categoriasData = []; // El JSON de los menús
        let productosData = [];  // Los productos que se cargan al hacer clic

        const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

        // 1. Cargar los menús desde el scraper
        fetch('productos.json')
            .then(r => r.json())
            .then(data => {
                categoriasData = data;
                renderMenu();
            })
            .catch(err => {
                document.getElementById("catalogGrid").innerHTML = `<p style="grid-column: 1/-1; text-align:center;">Error cargando el menú. Ejecuta el robot primero.</p>`;
            });

        // 2. Pintar el menú desplegable como Yupoo
        function renderMenu() {
            const menu = document.getElementById("yupooMenu");
            categoriasData.forEach(cat => {
                const li = document.createElement("li");
                li.className = "nav-item";
                
                // Simulamos un menú desplegable con las mismas categorías
                li.innerHTML = `
                    <button class="nav-link">${esc(cat.title)} ▼</button>
                    <div class="dropdown">
                        <button onclick="loadProducts('${esc(cat.title)}')">Ver todo de ${esc(cat.title)}</button>
                    </div>
                `;
                menu.appendChild(li);
            });
        }

        // 3. Simular la carga de productos (Yupoo cargaría las fotos reales de esa carpeta aquí)
        function loadProducts(categoria) {
            const grid = document.getElementById("catalogGrid");
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--accent);">Cargando productos de ${categoria}...</p>`;
            
            // --- AQUÍ IRÍA LA LLAMADA A LA API PARA SACAR LAS FOTOS DE ESTA CATEGORÍA ---
            // Por ahora, para que veas cómo queda, simulamos unas tarjetas:
            setTimeout(() => {
                grid.innerHTML = "";
                const fakeData = [
                    { title: "Camiseta de " + categoria, img: "https://photo.yupoo.com/minkang/2f3e6c8c78/small.jpg" },
                    { title: "Edición Especial " + categoria, img: "https://photo.yupoo.com/minkang/5cf2787d6a/small.jpg" }
                ];
                
                fakeData.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${esc(p.img)}" class="card-img" referrerpolicy="no-referrer">
                        </div>
                        <div class="card-body">
                            <span class="card-tag">${esc(categoria)}</span>
                            <h3 class="card-title">${esc(p.title)}</h3>
                        </div>`;
                    grid.appendChild(card);
                });
            }, 500);
        }

        function closeModal() { document.getElementById("productModal").classList.remove("open"); }
    </script>
</body>
</html>
