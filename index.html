<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Armario del Gol</title>
    <link rel="icon" type="image/jpeg" href="imagenes/LOGO.BLA.jpg">
    <style>
        :root {
            --bg-dark: #070d09;
            --bg-card: #0f1d13;
            --accent: #2e7d32;
            --accent-bright: #4caf50;
            --accent-glow: rgba(46, 125, 50, 0.3);
            --text-main: #f1f8f2;
            --text-muted: #a3b8a8;
            --border: #1b3822;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background-color: rgba(7, 13, 9, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            padding: 1.2rem 5%;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        @media(min-width: 768px) {
            header { flex-direction: row; justify-content: space-between; }
        }

        .brand {
            display: flex; align-items: center; gap: 0.9rem; text-decoration: none; color: var(--text-main);
        }
        .brand img {
            width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-bright);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .brand span { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand span span { color: var(--accent-bright); }

        .header-controls {
            display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 600px; justify-content: flex-end; flex-wrap: wrap;
        }

        /* Estilo Desplegable de Categorías (Estilo Yupoo) */
        .category-select-container {
            position: relative;
            min-width: 200px;
        }
        .category-select {
            width: 100%;
            padding: 0.7rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%234caf50%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 10px;
            transition: all 0.3s;
        }
        .category-select:focus { border-color: var(--accent-bright); box-shadow: 0 0 15px var(--accent-glow); }

        .search-bar { flex: 1; min-width: 220px; }
        .search-bar input {
            width: 100%; padding: 0.7rem 1rem; border-radius: 30px;
            border: 1px solid var(--border); background: var(--bg-card); color: white;
            font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        .search-bar input:focus { border-color: var(--accent-bright); box-shadow: 0 0 15px var(--accent-glow); }

        /* Grid de Productos */
        .catalog {
            padding: 2rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .card {
            background: var(--bg-card); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border); transition: all 0.3s ease;
            display: flex; flex-direction: column; position: relative; cursor: pointer;
        }
        .card:hover { transform: translateY(-6px); border-color: var(--accent-bright); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .card-img-container { width: 100%; aspect-ratio: 1/1; background: #040805; position: relative; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover .card-img { transform: scale(1.05); }

        .card-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; justify-content: space-between; }
        .card-tag { font-size: 0.7rem; color: var(--accent-bright); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--text-main); line-height: 1.4; }

        /* Paginador clásico */
        .pagination-container {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
            gap: 1rem; padding: 2rem 1rem; max-width: 1200px; margin: 0 auto; color: var(--text-muted); font-size: 0.95rem;
        }
        .pagination {
            display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--bg-card);
        }
        .page-btn {
            background: transparent; border: none; border-right: 1px solid var(--border);
            color: var(--text-main); padding: 0.5rem 0.8rem; cursor: pointer; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; min-width: 38px; transition: background 0.2s;
        }
        .page-btn:last-child { border-right: none; }
        .page-btn:hover:not(:disabled) { background: rgba(76, 175, 80, 0.1); color: var(--accent-bright); }
        .page-btn.active { background: var(--accent-bright); color: #000; font-weight: 700; }
        .page-btn:disabled { color: var(--border); cursor: not-allowed; }

        .jump-container { display: flex; align-items: center; gap: 0.5rem; }
        .jump-input {
            width: 55px; padding: 0.4rem; background: var(--bg-card); border: 1px solid var(--border);
            color: white; text-align: center; border-radius: 4px; outline: none;
        }
        .jump-input:focus { border-color: var(--accent-bright); }
        .jump-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; transition: all 0.2s;
        }
        .jump-btn:hover { background: var(--accent-bright); color: #000; border-color: var(--accent-bright); }

        footer {
            text-align: center; padding: 2rem; border-top: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.85rem; margin-top: auto;
        }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 200; justify-content: center; align-items: center; padding: 1.5rem; backdrop-filter: blur(8px);
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--bg-card); border-radius: 20px; max-width: 500px; width: 100%;
            overflow: hidden; border: 1px solid var(--border); position: relative;
        }
        .close-btn {
            position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.6); border: none;
            color: white; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
            z-index: 10; display: flex; align-items: center; justify-content: center;
        }
        .close-btn:hover { background: var(--accent-bright); color: #000; }
        .modal-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #000; }
        .modal-info { padding: 1.5rem; text-align: center; }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <img src="imagenes/LOGO.BLA.jpg" alt="Logo" onerror="this.src='imagenes/logo.jpg'">
            <div>EL ARMARIO DEL <span>GOL</span></div>
        </a>
        <div class="header-controls">
            <!-- Menú Desplegable de Categorías tipo Yupoo -->
            <div class="category-select-container">
                <select id="categorySelect" class="category-select" onchange="changeCategory(this.value)">
                    <option value="Todos">All Categories ▼</option>
                </select>
            </div>
            <!-- Barra de Búsqueda -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for albums/pictures..." oninput="currentPage=1; renderCatalog()">
            </div>
        </div>
    </header>

    <main class="catalog" id="catalogGrid"></main>

    <div class="pagination-container" id="paginationContainer"></div>

    <footer>
        <p>© 2026 El Armario del Gol • Catálogo Exclusivo</p>
    </footer>

    <div class="modal" id="productModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">×</button>
            <img id="mImg" class="modal-img" src="" alt="">
            <div class="modal-info">
                <span class="card-tag" id="mCat"></span>
                <h2 class="modal-title" id="mTitle"></h2>
            </div>
        </div>
    </div>

    <script>
        let productos = [];
        let currentCategory = "Todos";
        let currentPage = 1;
        const itemsPerPage = 32;

        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                productos = data;
                initCategoryDropdown();
                renderCatalog();
            })
            .catch(err => console.error("Error cargando el catálogo:", err));

        function initCategoryDropdown() {
            const select = document.getElementById("categorySelect");
            // Extrae todas las categorías únicas del JSON generado
            const uniqueCats = [...new Set(productos.map(p => p.category))].filter(Boolean).sort();
            
            select.innerHTML = `<option value="Todos">All Categories ▼</option>`;
            uniqueCats.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function changeCategory(cat) {
            currentCategory = cat;
            currentPage = 1;
            renderCatalog();
        }

        function renderCatalog() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const grid = document.getElementById("catalogGrid");
            grid.innerHTML = "";

            const filtered = productos.filter(p => {
                const matchCat = currentCategory === "Todos" || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(start, start + itemsPerPage);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:3rem;">No products found.</p>`;
                document.getElementById("paginationContainer").innerHTML = "";
                return;
            }

            paginatedItems.forEach(p => {
                grid.innerHTML += `
                    <div class="card" onclick="openModal('${p.img}', '${p.title}', '${p.category}')">
                        <div class="card-img-container">
                            <img src="${p.img}" alt="${p.title}" class="card-img" loading="lazy">
                        </div>
                        <div class="card-body">
                            <div>
                                <span class="card-tag">${p.category}</span>
                                <h3 class="card-title">${p.title}</h3>
                            </div>
                        </div>
                    </div>
                `;
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById("paginationContainer");
            if (totalPages <= 1) {
                container.innerHTML = "";
                return;
            }

            let html = `<div class="pagination">`;
            html += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><</button>`;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) {
                startPage = Math.max(1, endPage - 4);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>></button>`;
            html += `</div>`;

            html += `<span>in total ${totalPages} pages</span>`;
            html += `<div class="jump-container">`;
            html += `to <input type="number" id="jumpInput" class="jump-input" min="1" max="${totalPages}" value="${currentPage}"> page`;
            html += `<button class="jump-btn" onclick="jumpToPage(${totalPages})">Confirm</button>`;
            html += `</div>`;

            container.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderCatalog();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function jumpToPage(totalPages) {
            const input = document.getElementById("jumpInput");
            let val = parseInt(input.value);
            if (val >= 1 && val <= totalPages) {
                currentPage = val;
                renderCatalog();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function openModal(img, title, category) {
            document.getElementById("mImg").src = img;
            document.getElementById("mTitle").innerText = title;
            document.getElementById("mCat").innerText = category;
            document.getElementById("productModal").classList.add("open");
        }

        function closeModal() {
            document.getElementById("productModal").classList.remove("open");
        }
    </script>
</body>
</html>
