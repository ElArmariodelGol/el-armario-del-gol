<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El Armario del Gol | Catálogo</title>
  <link rel="icon" type="image/jpeg" href="imagenes/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #131c2e;
      --accent: #10b981; /* Verde El Armario del Gol */
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); font-size: 14px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    /* Store Header (Marca) */
    .store-header { background: var(--bg-dark); border-bottom: 1px solid var(--border); }
    .store-header-inner { max-width: 1400px; margin: 0 auto; padding: 20px 24px 0; }
    .store-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; }
    .store-profile { display: flex; align-items: center; gap: 14px; }
    .store-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .store-title { font-size: 20px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
    .store-title span { color: var(--accent); }
    .store-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Buscador */
    .search-box { display: flex; align-items: center; width: 100%; max-width: 380px; border: 1px solid var(--border); border-radius: 30px; overflow: hidden; background: var(--bg-card); }
    .search-box input { flex: 1; border: none; outline: none; padding: 10px 16px; font-size: 13px; color: var(--text-main); background: transparent; }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box button { background: var(--accent); color: #000; border: none; padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .search-box button:hover { background: var(--accent-hover); }

    /* Nav Tabs */
    .store-nav { display: flex; gap: 28px; border-top: 1px solid var(--border); padding-top: 2px; overflow-x: auto; }
    .store-nav a { padding: 12px 2px; font-size: 14px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
    .store-nav a:hover { color: var(--text-main); }
    .store-nav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

    /* Main Container */
    .main-container { max-width: 1400px; margin: 20px auto; padding: 0 24px; display: flex; gap: 20px; align-items: flex-start; flex: 1; width: 100%;}

    /* Menú Lateral (Sidebar) */
    .sidebar { width: 260px; flex-shrink: 0; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .sidebar-header { padding: 14px 16px; background: var(--accent); color: #000; font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .cat-item { border-bottom: 1px solid var(--border); }
    .cat-item:last-child { border-bottom: none; }
    .cat-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; transition: background 0.15s; }
    .cat-row:hover { background: #1e293b; }
    .cat-row a { font-size: 13px; color: var(--text-main); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .cat-row a:hover { color: var(--accent); }
    .cat-toggle { font-size: 11px; color: var(--text-muted); padding: 2px 6px; border-radius: 4px; background: #0f172a; margin-left: 6px; user-select: none; font-weight: bold; }
    
    .subcat-list { display: none; background: #0b0f19; padding: 4px 0 8px 22px; border-top: 1px solid var(--border); }
    .subcat-list.open { display: block; }
    .subcat-list a { display: block; padding: 6px 12px; font-size: 12px; color: var(--text-muted); }
    .subcat-list a:hover { color: var(--accent); }

    /* Contenido (Grid de Productos) */
    .content { flex: 1; min-width: 0; }
    .toolbar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .breadcrumb { font-size: 13px; color: var(--text-muted); }
    .breadcrumb strong { color: var(--text-main); }
    .filter-pills { display: flex; gap: 6px; }
    .pill-btn { border: 1px solid var(--border); background: transparent; color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.15s; font-weight: 600; }
    .pill-btn.active, .pill-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 16px; }
    .album-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: transform 0.18s ease, box-shadow 0.18s ease; display: flex; flex-direction: column; }
    .album-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-color: var(--accent); }
    
    .album-thumb-wrap { position: relative; width: 100%; padding-top: 100%; background: #070a10; overflow: hidden; cursor: pointer; }
    .album-thumb-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.25s ease; }
    .album-card:hover .album-thumb-wrap img { transform: scale(1.05); }
    
    .photo-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
    .zoom-badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #000; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; opacity: 0; transition: opacity 0.2s; }
    .album-card:hover .zoom-badge { opacity: 1; }

    .album-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .album-title { font-size: 12.5px; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; font-weight: 500;}
    .album-title:hover { color: var(--accent); }
    
    .album-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 8px; font-size: 11px; }
    .album-link { color: var(--accent); font-weight: 700; }
    .album-link:hover { text-decoration: underline; }

    /* Paginación */
    .pagination { margin-top: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .page-btns { display: flex; gap: 6px; }
    .page-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; color: var(--text-muted); background: transparent; transition: all 0.2s;}
    .page-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
    .page-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    /* Lightbox Modal */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
    .lightbox.open { display: flex; }
    .lightbox-box { background: var(--bg-card); border-radius: 12px; max-width: 720px; width: 100%; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid var(--border); animation: scaleUp 0.2s ease; }
    @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .lightbox-img-wrap { background: #000; display: flex; align-items: center; justify-content: center; max-height: 70vh; }
    .lightbox-img-wrap img { max-width: 100%; max-height: 70vh; object-fit: contain; }
    .lightbox-footer { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .lightbox-title { font-size: 14px; font-weight: 600; color: var(--text-main); flex: 1; }
    .lightbox-btns { display: flex; gap: 8px; flex-shrink: 0; }
    
    .btn-primary { background: var(--accent); color: #000; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; font-weight: 600; }
    .btn-secondary:hover { background: #475569; }

    footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: auto; }

    @media (max-width: 860px) {
      .main-container { flex-direction: column; }
      .sidebar { width: 100%; }
      .album-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>

&referrercate=", "img": "https://photo.yupoo.com/minkang/4d1bd74d62/small.jpg", "count": "5"}, {"title": "JB Mint Green Geometric Pattern Contrast Panel Basketball Shorts XS-4XL", "href": "https://minkang.x.yupoo.com/albums/263403798?uid=1&isSubCate=false&referrercate=", "img": "https://photo.yupoo.com/minkang/0d79c05340/small.jpg", "count": "5"}, {"title": "JB Mint Green Black Abstract Brushstroke Print Mesh Basketball Shorts XS-4XL", "href": "https://minkang.x.yupoo.com/albums/263403789?uid=1&isSubCate=false&referrercate=", "img": "https://photo.yupoo.com/minkang/8c44c26d2e/small.jpg", "count": "3"}, {"title": "JB Mint Green And White Trim Mesh Basketball Shorts XS-4XL", "href": "https://minkang.x.yupoo.com/albums/263403754?uid=1&isSubCate=false&referrercate=", "img": "https://photo.yupoo.com/minkang/6bb483e360/small.jpg", "count": "5"}, {"title": "JB Mint Green And White Tie-Dye Print Mesh Basketball Shorts XS-4XL", "href": "https://minkang.x.yupoo.com/albums/263403712?uid=1&isSubCate=false&referrercate=", "img": "https://photo.yupoo.com/minkang/18b853a3cf/small.jpg", "count": "5"}, {"title": "JB Lime Green And Black White Trim Mesh Basketball Shorts XS-4XL", "href": "https://minkang.x.yupoo.com/albums/263403690?uid=1&isSubCate=false&referrercate=", "img": "https://photo.yupoo.com/minkang/65e93fcad9/small.jpg", "count": "3"}];

    // --- LÓGICA DE LA WEB ---
    const categoryListEl = document.getElementById('categoryList');
    const albumGridEl = document.getElementById('albumGrid');
    const searchInputEl = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const visibleCountEl = document.getElementById('visibleCount');
    const pillBtns = document.querySelectorAll('.pill-btn');
    const catCountEl = document.getElementById('catCount');

    let activeBrand = 'ALL';

    // Pintar Categorías
    function renderCategories() {
      catCountEl.textContent = CATEGORIES.length;
      categoryListEl.innerHTML = CATEGORIES.map((cat, idx) => {
        const hasSubs = cat.subcats && cat.subcats.length > 0;
        const subsHtml = hasSubs ? `
          <div class="subcat-list" id="subcat-${idx}">
            ${cat.subcats.map(s => `<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join('')}
          </div>
        ` : '';
        return `
          <div class="cat-item">
            <div class="cat-row" ${hasSubs ? `onclick="toggleSubcat(${idx}, event)"` : ''}>
              <a href="${cat.href}" target="_blank" rel="noopener" title="${cat.title}">${cat.title}</a>
              ${hasSubs ? `<span class="cat-toggle">+${cat.subcats.length}</span>` : ''}
            </div>
            ${subsHtml}
          </div>
        `;
      }).join('');
    }

    window.toggleSubcat = function(idx, event) {
      if (event.target.tagName === 'A') return;
      const el = document.getElementById('subcat-' + idx);
      if (el) el.classList.toggle('open');
    };

    // Pintar Productos
    function renderAlbums() {
      const query = searchInputEl.value.trim().toLowerCase();
      const filtered = ALBUMS.filter(item => {
        const matchesBrand = activeBrand === 'ALL' || item.title.toUpperCase().startsWith(activeBrand);
        const matchesQuery = !query || item.title.toLowerCase().includes(query);
        return matchesBrand && matchesQuery;
      });

      visibleCountEl.textContent = filtered.length;

      albumGridEl.innerHTML = filtered.map((item) => {
        const highRes = item.img.replace('/small.jpg', '/medium.jpg');
        const safeTitle = item.title.replace(/"/g, '&quot;');
        const jsSafeTitle = item.title.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return `
          <article class="album-card">
            <div class="album-thumb-wrap" onclick="openLightbox('${highRes}', '${jsSafeTitle}', '${item.href}')">
              <img src="${item.img}" referrerpolicy="no-referrer" loading="lazy" alt="${safeTitle}">
              <span class="zoom-badge">Ampliar</span>
              <span class="photo-badge">${item.count} fotos</span>
            </div>
            <div class="album-info">
              <a class="album-title" href="${item.href}" target="_blank" rel="noopener" title="${safeTitle}">
                ${item.title}
              </a>
              <div class="album-actions">
                <span style="color:var(--text-muted);">${item.count} imgs</span>
                <a class="album-link" href="${item.href}" target="_blank" rel="noopener">Ver &rarr;</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // Modal Lightbox
    const lightboxEl = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxAlbumLink = document.getElementById('lightboxAlbumLink');
    const closeLightboxBtn = document.getElementById('closeLightbox');

    window.openLightbox = function(imgUrl, title, href) {
      lightboxImg.src = imgUrl;
      lightboxTitle.textContent = title;
      lightboxAlbumLink.href = href;
      lightboxEl.classList.add('open');
    };

    closeLightboxBtn.addEventListener('click', () => lightboxEl.classList.remove('open'));
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl) lightboxEl.classList.remove('open');
    });

    // Eventos
    searchInputEl.addEventListener('input', renderAlbums);
    clearSearchBtn.addEventListener('click', () => {
      searchInputEl.value = '';
      renderAlbums();
    });

    pillBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        pillBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeBrand = btn.dataset.brand;
        renderAlbums();
      });
    });

    // Iniciar
    renderCategories();
    renderAlbums();
  </script>
</body>
</html>
