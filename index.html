<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamisStore - Equipaciones de Fútbol</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; }

        /* Header y Buscador */
        header {
            background-color: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            padding: 1rem 5%;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;
        }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--accent); }
        
        .search-bar { flex: 1; max-width: 400px; }
        .search-bar input {
            width: 100%; padding: 0.6rem 1rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-card); color: white;
        }

        .cart-btn {
            background: var(--accent); color: #000; border: none; padding: 0.6rem 1.2rem;
            border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
        }

        /* Filtros */
        .filters {
            padding: 1.5rem 5% 0.5rem;
            display: flex; gap: 0.5rem; overflow-x: auto;
        }
        .filter-btn {
            background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border);
            padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; white-space: nowrap;
        }
        .filter-btn.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }

        /* Grid de Productos */
        .catalog {
            padding: 1.5rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--bg-card); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border); transition: transform 0.2s; cursor: pointer;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .card-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #0b1120; }
        .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-tag { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; font-weight: 700; }
        .card-title { font-size: 1rem; font-weight: 600; margin: 0.3rem 0; }
        .card-price { font-size: 1.2rem; font-weight: 800; margin-top: 0.5rem; }

        /* Modales (Producto y Carrito) */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 200; justify-content: center; align-items: center; padding: 1rem;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--bg-card); border-radius: 12px; max-width: 600px; width: 100%;
            max-height: 90vh; overflow-y: auto; padding: 1.5rem; border: 1px solid var(--border); position: relative;
        }
        .close-btn {
            position: absolute; top: 1rem; right: 1rem; background: none; border: none;
            color: var(--text-muted); font-size: 1.5rem; cursor: pointer;
        }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 600px) { .modal-grid { grid-template-columns: 1fr; } }

        .form-group { margin: 1rem 0; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        .form-group select, .form-group input {
            width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-dark); color: white;
        }
        .sizes { display: flex; gap: 0.5rem; }
        .size-opt {
            flex: 1; text-align: center; padding: 0.5rem; border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .size-opt.selected { background: var(--accent); color: #000; border-color: var(--accent); }

        .btn-primary {
            width: 100%; background: var(--accent); color: #000; border: none; padding: 0.8rem;
            border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1rem;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 0; border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">EL ARMARIO DEL <span>GOL</span></a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar equipo, temporada, jugador...">
        </div>
        <button class="cart-btn" onclick="openCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
    </header>

    <div class="filters" id="categoryFilters">
        <button class="filter-btn active" onclick="filterCategory('Todos', this)">Todos</button>
        <button class="filter-btn" onclick="filterCategory('LaLiga', this)">LaLiga</button>
        <button class="filter-btn" onclick="filterCategory('Premier League', this)">Premier League</button>
        <button class="filter-btn" onclick="filterCategory('Selecciones', this)">Selecciones</button>
        <button class="filter-btn" onclick="filterCategory('Retro', this)">Retro</button>
        <button class="filter-btn" onclick="filterCategory('Otros', this)">Otros</button>
    </div>

    <main class="catalog" id="catalogGrid"></main>

    <!-- Modal Detalle Producto -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('productModal')">×</button>
            <div class="modal-grid">
                <img id="mImg" src="" alt="" style="width:100%; border-radius:8px;">
                <div>
                    <span class="card-tag" id="mCat"></span>
                    <h2 id="mTitle" style="margin: 0.3rem 0;"></h2>
                    <p class="card-price" id="mPrice"></p>

                    <div class="form-group">
                        <label>Talla:</label>
                        <div class="sizes" id="sizeSelector">
                            <div class="size-opt selected" onclick="selectSize(this)">S</div>
                            <div class="size-opt" onclick="selectSize(this)">M</div>
                            <div class="size-opt" onclick="selectSize(this)">L</div>
                            <div class="size-opt" onclick="selectSize(this)">XL</div>
                            <div class="size-opt" onclick="selectSize(this)">XXL</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Personalización (+3€ opcional):</label>
                        <input type="text" id="mCustom" placeholder="Ej: YAMAL 19" oninput="updateModalPrice()">
                    </div>

                    <div class="form-group">
                        <label>Parches (+2€ opcional):</label>
                        <select id="mPatch" onchange="updateModalPrice()">
                            <option value="0">Sin parches</option>
                            <option value="2">Parche Liga (+2€)</option>
                            <option value="2">Parche Champions (+2€)</option>
                        </select>
                    </div>

                    <button class="btn-primary" onclick="addToCart()">Añadir al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Carrito -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('cartModal')">×</button>
            <h2>Tu Pedido</h2>
            <div id="cartItems" style="margin: 1rem 0;"></div>
            <h3 style="text-align: right;">Total: <span id="cartTotal">0</span>€</h3>
            <button class="btn-primary" onclick="checkoutWhatsApp()">Finalizar pedido por WhatsApp</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN: Pon aquí tu número de WhatsApp con código de país (sin +)
        const WHATSAPP_NUMBER = "34600000000";

        let productos = [];

        // Cargar los productos que ha descargado el robot de Yupoo
        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                productos = data;
                renderCatalog();
            })
            .catch(err => console.error("Error cargando el catálogo:", err));

        let currentProduct = null;
        let selectedSize = "S";
        let currentCategory = "Todos";
        let cart = [];

        // Renderizar catálogo
        function renderCatalog() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const grid = document.getElementById("catalogGrid");
            grid.innerHTML = "";

            const filtered = productos.filter(p => {
                const matchCat = currentCategory === "Todos" || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="card" onclick="openProduct(${p.id})">
                        <img src="${p.img}" alt="${p.title}" class="card-img" loading="lazy">
                        <div class="card-body">
                            <div>
                                <span class="card-tag">${p.category}</span>
                                <h3 class="card-title">${p.title}</h3>
                            </div>
                            <div class="card-price">${p.price}€</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderCatalog();
        }

        document.getElementById("searchInput").addEventListener("input", renderCatalog);

        // Lógica Modal Producto
        function openProduct(id) {
            currentProduct = productos.find(p => p.id === id);
            document.getElementById("mImg").src = currentProduct.img;
            document.getElementById("mCat").innerText = currentProduct.category;
            document.getElementById("mTitle").innerText = currentProduct.title;
            document.getElementById("mCustom").value = "";
            document.getElementById("mPatch").value = "0";
            updateModalPrice();
            document.getElementById("productModal").classList.add("open");
        }

        function selectSize(el) {
            document.querySelectorAll(".size-opt").forEach(s => s.classList.remove("selected"));
            el.classList.add("selected");
            selectedSize = el.innerText;
        }

        function updateModalPrice() {
            let total = currentProduct.price;
            if (document.getElementById("mCustom").value.trim() !== "") total += 3;
            total += parseInt(document.getElementById("mPatch").value);
            document.getElementById("mPrice").innerText = total + "€";
            return total;
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("open");
        }

        // Lógica Carrito
        function addToCart() {
            const finalPrice = updateModalPrice();
            const custom = document.getElementById("mCustom").value.trim();
            const patchSelect = document.getElementById("mPatch");
            const patchText = patchSelect.value !== "0" ? patchSelect.options[patchSelect.selectedIndex].text : "Sin parche";

            cart.push({
                title: currentProduct.title,
                size: selectedSize,
                custom: custom || "Sin dorsal",
                patch: patchText,
                price: finalPrice
            });

            document.getElementById("cartCount").innerText = cart.length;
            closeModal("productModal");
        }

        function openCart() {
            const container = document.getElementById("cartItems");
            container.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted)'>El carrito está vacío.</p>";
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    container.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.title}</strong><br>
                                <small style="color:var(--text-muted)">Talla: ${item.size} | Dorsal: ${item.custom} | ${item.patch}</small>
                            </div>
                            <div>
                                <strong>${item.price}€</strong>
                                <button onclick="removeItem(${index})" style="background:none;border:none;color:#ef4444;cursor:pointer;margin-left:8px;">✕</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById("cartTotal").innerText = total;
            document.getElementById("cartModal").classList.add("open");
        }

        function removeItem(index) {
            cart.splice(index, 1);
            document.getElementById("cartCount").innerText = cart.length;
            openCart();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return;
            let mensaje = "Hola, quiero hacer el siguiente pedido:\n\n";
            let total = 0;

            cart.forEach((item, i) => {
                mensaje += `${i + 1}. *${item.title}*\n   - Talla: ${item.size}\n   - Dorsal: ${item.custom}\n   - Parche: ${item.patch}\n   - Precio: ${item.price}€\n\n`;
                total += item.price;
            });

            mensaje += `*TOTAL A PAGAR: ${total}€*`;
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, "_blank");
        }
    </script>
</body>
</html>
