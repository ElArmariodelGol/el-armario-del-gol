name: Actualizar Catalogo Yupoo
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar navegador Chrome (necesario para Selenium)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          
      - name: Instalar librerías de Python
        run: pip install requests beautifulsoup4 selenium webdriver-manager

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en la web
        run: |
          git config --global user.name "Bot Catalogo"
          git config --global user.email "bot@noreply.github.com"
          git add productos.json
          git commit -m "Actualización automática desde Yupoo" || exit 0
          git push